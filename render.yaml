services:
  - type: web
    name: student-ai-backend
    runtime: docker
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CHROMA_PATH
        value: /tmp/.chroma
      - key: CHROMA_COLLECTION
        value: students